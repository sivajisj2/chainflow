apiVersion: apps/v1
kind: Deployment
metadata:
  name: chainflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chainflow
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: chainflow
    spec:
      containers:
        - name: chainflow
          image: chainflow:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chainflow-secrets
                  key: DATABASE_URL
            - name: RUST_LOG
              value: info
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chainflow
spec:
  type: ClusterIP
  selector:
    app: chainflow
  ports:
    - port: 3000
      targetPort: 3000