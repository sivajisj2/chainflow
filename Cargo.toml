[package]
name = "chainflow"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "macros", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
redis = { version = "1.8.0", features = ["tokio-comp"] }
lapin = "4.12.3"
futures-lite = "2.6.1"
async-rs = "0.8.13"
tonic = { version = "0.14.7", features = ["transport"] }
prost = "0.14.4"
tonic-prost = "0.14.7"
serde_json = "1.0.154"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[build-dependencies]
tonic-prost-build = "0.14.7"
